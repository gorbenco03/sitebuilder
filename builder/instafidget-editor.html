<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor Instafidget</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f1e8; color: #201d19; padding: 24px; }
    main { width: min(560px, 100%); background: #fffdf8; border: 1px solid #ded7ca; border-radius: 18px; padding: 32px; box-shadow: 0 18px 50px rgba(41, 34, 24, .1); }
    .eyebrow { color: #8a5b34; font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(1.65rem, 5vw, 2.35rem); line-height: 1.08; }
    p { margin: 0; color: #625b52; font-size: 1rem; line-height: 1.6; }
    a { display: inline-flex; margin-top: 24px; min-height: 44px; align-items: center; border-radius: 10px; padding: 0 18px; background: #201d19; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Instafidget</div>
    <h1>Editorul este pregătit.</h1>
    <p>Conexiunea Instagram este activă. Poți reveni în Hidook Site Builder; feed-ul conectat rămâne salvat în proiect.</p>
    <a href="/app/#edit">Revino la site</a>
  </main>
</body>
</html>
