<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programări — dashboard owner</title>
  <link rel="stylesheet" href="/calendar-native/owner/owner-dashboard.css" />
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #f3f6f4; color: #14201c; }
    .hod-boot { max-width: 420px; margin: 48px auto; padding: 24px; text-align: center; color: #5c6d66; font-size: 14px; }
  </style>
</head>
<body class="hod">
  <div id="hod-boot" class="hod-boot">Se deschide dashboard-ul…</div>
  <div
    id="hod-root"
    data-hidook-cal-owner
    data-customer-id="demo_customer_elena"
    data-site-id="demo_site_cabinet"
    data-api-base=""
    data-brand="Cabinet Dr. Elena Pop"
    hidden
  ></div>
  <script>
    (function () {
      function mountDashboard() {
        var s = document.createElement('script');
        s.src = '/calendar-native/owner/owner-dashboard.js';
        document.body.appendChild(s);
      }

      var params = new URLSearchParams(window.location.search);
      var qCustomerId = (params.get('customerId') || '').trim();
      var qSiteId = (params.get('siteId') || '').trim();

      if (qCustomerId && qSiteId) {
        // Real owner mode (Wave 8 reachability fix): the builder's dashboard
        // links here with the signed-in owner's own userId + their real
        // siteId (see builder/app.js buildSiteCard). This page must NOT mint
        // a demo session in that case — that would sign the browser in as
        // DEMO.customerId and silently replace whatever real hb_session
        // cookie the owner already has from a normal login. Every API call
        // owner-dashboard.js makes is still authenticated + tenant-checked
        // server-side (resolveOwnerTenantOrReject requires customerId ===
        // the session's own userId), so a wrong/forged id here simply gets a
        // 403/401 from the API, same as any other tampered request.
        var root = document.getElementById('hod-root');
        var boot = document.getElementById('hod-boot');
        if (root) {
          root.setAttribute('data-customer-id', qCustomerId);
          root.setAttribute('data-site-id', qSiteId);
          // Drop the hardcoded demo brand — an optional ?brand= from the
          // builder (site.projectName) names the real business; otherwise
          // owner-dashboard.js's own default ("Calendar") applies.
          var qBrand = (params.get('brand') || '').trim();
          if (qBrand) root.setAttribute('data-brand', qBrand);
          else root.removeAttribute('data-brand');
          root.hidden = false;
        }
        if (boot) boot.remove();
        mountDashboard();
        return;
      }

      // No query params: local/non-prod preview — mint a demo owner session,
      // then mount the dashboard. Unchanged from before; screenshot tooling
      // and any bare /calendar-native/owner/ visit still lands here.
      fetch('/api/calendar-native/owner/preview-session', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { Accept: 'application/json' },
      })
        .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
        .then(function (res) {
          var boot = document.getElementById('hod-boot');
          var root = document.getElementById('hod-root');
          if (!res.ok || !res.body || !res.body.ok) {
            if (boot) {
              boot.textContent =
                (res.body && res.body.error) ||
                'Autentificare necesară pentru dashboard-ul owner.';
            }
            return;
          }
          if (boot) boot.remove();
          if (root) {
            root.hidden = false;
            if (res.body.brand) root.setAttribute('data-brand', res.body.brand);
          }
          mountDashboard();
        })
        .catch(function () {
          var boot = document.getElementById('hod-boot');
          if (boot) boot.textContent = 'Nu am putut deschide sesiunea demo.';
        });
    })();
  </script>
</body>
</html>
