<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESSERD — Circular Carousel (widget demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="carousel.css">
<style>
  :root {
    --pink: #E8588C;
    --pink-dark: #d14477;
    --cream: #faf8f8;
    --text: #2d2d2d;
    --muted: #8a8a8a;
    --serif: 'Cormorant Garamond', serif;
    --sans: 'Montserrat', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--text);
    background: radial-gradient(1200px 600px at 50% -10%, #fff 0%, var(--cream) 55%, #f3eaee 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.4rem 1rem 3rem;
    overflow-x: hidden;
  }
  .eyebrow {
    font-size: .72rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--muted); margin-bottom: .4rem; text-align: center;
  }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(1.9rem, 5vw, 3.2rem);
    margin-bottom: .2rem; text-align: center;
  }
  h1 span { color: var(--pink); font-style: italic; }
  .sub {
    color: var(--muted); font-size: .85rem;
    margin-bottom: 1rem; text-align: center; padding: 0 .5rem;
  }
  .hint {
    margin-top: 1.1rem; color: var(--muted); font-size: .78rem;
    text-align: center; padding: 0 1rem;
  }
  /* centre the carousel stage */
  #carousel { max-width: 1180px; width: 100%; }
</style>
</head>
<body>

  <p class="eyebrow">DESSERD · component demo</p>
  <h1><span>Circular</span> Carousel</h1>
  <p class="sub">4 photos up front · the rest sit quietly behind · click a photo to enlarge</p>

  <!-- The carousel mounts here -->
  <div id="carousel"></div>

  <p class="hint">Drag with your finger or mouse, use the arrows, or let it spin on its own. Click the front photo to enlarge it.</p>

<script src="carousel.js"></script>
<script>
  DessertCarousel.init(document.getElementById('carousel'), {
    images: [
      'images/torturi-1.jpg',
      'images/torturi-2.jpg',
      'images/torturi-3.jpg',
      'images/torturi-4.jpg',
      'images/torturi-5.jpg',
      'images/torturi-6.jpg',
      'images/torturi-7.jpg',
      'images/catering-1.jpg',
      'images/catering-2.jpg',
      'images/placinte-1.jpg',
      'images/cupcakes-1.jpg',
      'images/cupcakes-2.jpg'
    ],
    autoplay: true,
    interval: 3200
  });
</script>
</body>
</html>
